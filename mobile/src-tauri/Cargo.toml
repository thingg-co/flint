[package]
name = "flint-mobile"
version = "0.3.0"
description = "Flint dashboard client"
edition = "2021"

[lib]
name = "flint_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
