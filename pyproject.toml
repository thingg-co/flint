[project]
name = "flint"
version = "0.4.1"
description = "Continuously learning market model with a live web dashboard"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "ib-async>=2.1.0",
]

[project.scripts]
flint = "flint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flint"]
